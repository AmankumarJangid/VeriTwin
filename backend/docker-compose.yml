version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: veritwin-postgres
    restart: always
    environment:
      POSTGRES_USER: veritwin
      POSTGRES_PASSWORD: veritwin
      POSTGRES_DB: veritwin
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U veritwin -d veritwin']
      interval: 5s
      timeout: 5s
      retries: 5

  image-service:
    build:
      context: ./image-service
      dockerfile: Dockerfile
    container_name: veritwin-image-service
    restart: always
    environment:
      IMAGE_SERVICE_KEY: internal-shared-secret
    ports:
      - '8000:8000'
    healthcheck:
      test: ['CMD-SHELL', 'python -c "import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")"']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: veritwin-api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      image-service:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_BASE_URL: http://localhost:4000
      DATABASE_URL: postgresql://veritwin:veritwin@postgres:5432/veritwin
      JWT_ACCESS_SECRET: production-access-secret-32plus-chars-long
      ACCESS_TOKEN_TTL_SECONDS: 900
      REFRESH_TOKEN_TTL_DAYS: 7
      QR_HMAC_SECRET: production-qr-hmac-secret-32plus-chars-long
      TRANSFER_TTL_SECONDS: 120
      IMAGE_SERVICE_URL: http://image-service:8000
      IMAGE_SERVICE_KEY: internal-shared-secret
      WM_CONFIDENCE_THRESHOLD: 0.75
      IMAGE_SERVICE_MOCK: 'false'
      MANUFACTURER_INVITE_CODE: MAKER-2026
      RETAILER_INVITE_CODE: RETAIL-2026
      STORAGE_DIR: ./storage
      MAX_UPLOAD_MB: 8
    ports:
      - '4000:4000'
    volumes:
      - api-storage:/app/storage

volumes:
  pgdata:
  api-storage:
